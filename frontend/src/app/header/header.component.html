<div class="header" *ngIf="!login">
    <h1>PORTAL FOR AGRI-BUSINESS</h1>
</div>
<div class="header login" *ngIf="login">
    <div class="header_heading">
        <h1>PORTAL FOR AGRI-BUSINESS</h1>
    </div>
    <div class="login-sub-flex">
        <div class="content">
            <h2>{{userData.name | titlecase}}</h2>
            <p>Admin</p>
        </div>
        <div>
            <img [matMenuTriggerFor]="menu2" src="../../assets/profile.jpg">
            <mat-menu class="log_out_menu" #menu2="matMenu" [xPosition]="'before'" [yPosition]="'below'">
                <button mat-menu-item>
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                        class="bi bi-power" viewBox="0 0 16 16">
                        <path d="M7.5 1v7h1V1z" />
                        <path
                            d="M3 8.812a5 5 0 0 1 2.578-4.375l-.485-.874A6 6 0 1 0 11 3.616l-.501.865A5 5 0 1 1 3 8.812" />
                    </svg>
                    <p class="delete_text" (click)="logOut()">Log Out</p>
                </button>
            </mat-menu>
        </div>
    </div>
</div>
